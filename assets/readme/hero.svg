<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">bilibili-to-wiki — B站视频一键入库 LLM Wiki 知识库</title>
  <desc id="hero-desc">把 B 站视频变成知识库素材的桥接 skill：抓取字幕、术语勘误、消化入库、反哺术语表、重建图谱。右侧展示 4 条真实勘误。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7299"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>
  <!-- 背景网格（技术感） -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M100 0V380M200 0V380M300 0V380M400 0V380M500 0V380M600 0V380M700 0V380M800 0V380M900 0V380M1000 0V380M1100 0V380"/>
    <path d="M0 95H1200M0 190H1200M0 285H1200"/>
  </g>

  <!-- 左侧：标题区 -->
  <g transform="translate(64 78)">
    <rect x="0" y="0" rx="14" width="150" height="34" fill="#fb7299" fill-opacity="0.15" stroke="#fb7299" stroke-opacity="0.6" stroke-width="1"/>
    <text x="75" y="23" text-anchor="middle" font-family="Segoe UI, PingFang SC, sans-serif" font-size="17" font-weight="600" fill="#fb7299">AI SKILL 编排</text>

    <text x="0" y="106" font-family="Segoe UI, PingFang SC, sans-serif" font-size="66" font-weight="700" fill="#f0f6fc">bilibili-to-wiki</text>

    <text x="2" y="158" font-family="PingFang SC, Segoe UI, sans-serif" font-size="26" fill="#e6edf3">
      B站视频 一键进入你的
    </text>
    <text x="2" y="194" font-family="PingFang SC, Segoe UI, sans-serif" font-size="26" fill="#e6edf3">
      LLM Wiki 知识库
    </text>

    <text x="2" y="240" font-family="PingFang SC, Segoe UI, sans-serif" font-size="18" fill="#8b949e">
      抓取字幕 · 术语勘误 · 消化入库 · 图谱重建，全程自动
    </text>

    <!-- 元数据条 -->
    <g font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">
      <rect x="0" y="268" rx="12" width="86" height="30" fill="#161b22" stroke="#30363d"/>
      <text x="43" y="288" text-anchor="middle" fill="#7ee787">v1.0.0</text>
      <rect x="98" y="268" rx="12" width="72" height="30" fill="#161b22" stroke="#30363d"/>
      <text x="134" y="288" text-anchor="middle">MIT</text>
      <rect x="182" y="268" rx="12" width="150" height="30" fill="#161b22" stroke="#30363d"/>
      <text x="257" y="288" text-anchor="middle">pi · Agent Skills</text>
    </g>
  </g>

  <!-- 右侧：证明区（真实管道 + 勘误条目） -->
  <g transform="translate(700 64)">
    <!-- 管道模块：三节点流水线 -->
    <g font-family="PingFang SC, Segoe UI, sans-serif">
      <!-- 连接线（静态） -->
      <path d="M88 96H392" stroke="#30363d" stroke-width="3" stroke-dasharray="2 10"/>
      <path d="M88 96H392" stroke="url(#accent)" stroke-width="3" stroke-dasharray="2 10" stroke-opacity="0.9"/>

      <!-- 节点1 抓取 -->
      <circle cx="90" cy="96" r="34" fill="#161b22" stroke="#fb7299" stroke-width="2"/>
      <text x="90" y="92" text-anchor="middle" font-size="22">▶</text>
      <text x="90" y="153" text-anchor="middle" font-size="17" fill="#e6edf3">抓取字幕</text>

      <!-- 节点2 勘误 -->
      <circle cx="240" cy="96" r="34" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="240" y="93" text-anchor="middle" font-size="20" fill="#58a6ff">✓✗</text>
      <text x="240" y="153" text-anchor="middle" font-size="17" fill="#e6edf3">术语勘误</text>

      <!-- 节点3 入库 -->
      <circle cx="390" cy="96" r="34" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
      <text x="390" y="94" text-anchor="middle" font-size="20" fill="#7ee787">≡</text>
      <text x="390" y="153" text-anchor="middle" font-size="17" fill="#e6edf3">入库+图谱</text>
    </g>

    <!-- 勘误实例卡（真实数据） -->
    <g transform="translate(0 186)" font-family="SFMono-Regular, Menlo, monospace">
      <rect x="0" y="0" rx="16" width="450" height="130" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="24" y="34" font-size="15" fill="#8b949e">glossary 勘误（真实记录 · 2026-09-01）</text>

      <text x="24" y="66" font-size="16" fill="#fb7299">ATHROPIC</text>
      <text x="150" y="66" font-size="16" fill="#8b949e">→</text>
      <text x="176" y="66" font-size="16" fill="#7ee787">Anthropic</text>

      <text x="24" y="94" font-size="16" fill="#fb7299">grab</text>
      <text x="150" y="94" font-size="16" fill="#8b949e">→</text>
      <text x="176" y="94" font-size="16" fill="#7ee787">grep</text>

      <text x="24" y="122" font-size="16" fill="#fb7299">easy deset</text>
      <text x="150" y="122" font-size="16" fill="#8b949e">→</text>
      <text x="176" y="122" font-size="16" fill="#7ee787">Easy Dataset</text>
    </g>
  </g>
</svg>
